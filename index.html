<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{--P:400px;--k:1;--ink:#4a3320;--hand:"Bradley Hand","Segoe Script","Comic Sans MS","Chalkboard SE",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c4986a}
body{background:
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 radial-gradient(ellipse at 50% 40%,#d3aa7c 0%,#c4986a 60%,#a97f52 100%);
 font-family:var(--hand);color:var(--ink);user-select:none;-webkit-user-select:none}
.tape{position:fixed;width:120px;height:30px;background:rgba(246,233,107,.75);box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:0}
.tape.a{top:18px;left:-24px;transform:rotate(-35deg)}.tape.b{bottom:90px;right:-30px;transform:rotate(-35deg);background:rgba(154,107,176,.55)}
#stage{position:fixed;inset:0 0 78px 0;display:grid;place-items:center;z-index:1}
#book{position:relative;width:calc(var(--P)*2);height:calc(var(--P)*.75);perspective:calc(var(--P)*3.5)}
#book.ready{transition:transform 1s cubic-bezier(.6,.05,.3,1)}
#book.closed{transform:scale(var(--k)) translateX(calc(var(--P)*-.5))}
.page{position:absolute;top:0;width:var(--P);height:100%;background:#fff;overflow:hidden;box-shadow:0 8px 22px rgba(60,35,10,.4)}
#rp{left:var(--P);border-radius:0 6px 6px 0}
.page>img.bg,.face>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#rp::after,.back::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none;z-index:6}
#rp::after{left:0;background:linear-gradient(90deg,rgba(60,35,10,.35),transparent)}
.back::after{right:0;background:linear-gradient(270deg,rgba(60,35,10,.35),transparent)}
#flip{position:absolute;left:var(--P);top:0;width:var(--P);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
#flip.open{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(60,35,10,.4)}
.front{border-radius:0 6px 6px 0;cursor:pointer}
.back{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.lw{position:absolute;left:20.1%;top:16.9%;width:71.5%;z-index:3;cursor:pointer;transition:left .7s,top .7s,width .7s,transform .7s,opacity .25s .45s;opacity:0;filter:drop-shadow(0 6px 10px rgba(40,20,0,.45))}
.lw img{display:block;width:100%;clip-path:inset(0 0 43% 0);transition:clip-path .7s;-webkit-user-drag:none}
.lw.up{left:10%;top:13%;width:80%;transform:rotate(-1deg);opacity:1;z-index:5;transition:left .7s,top .7s,width .7s,transform .7s,opacity .15s}
.lw.up img{clip-path:inset(0)}
#flames{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;transform-origin:50% 100%;transition:opacity .3s}
.fl.out{opacity:0;transition:opacity .4s,transform .4s}
.fl img{display:block;width:100%;height:100%;transform-origin:50% 100%;animation:fk .2s infinite alternate ease-in-out;-webkit-user-drag:none}
@keyframes fk{from{transform:scale(1,1) rotate(-2.5deg)}to{transform:scale(1.05,1.08) rotate(2.5deg)}}
.smoke{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(120,110,100,.55),transparent 70%);animation:sm 1.5s ease-out forwards}
@keyframes sm{to{transform:translate(30%,-260%) scale(3.5);opacity:0}}
#wish{position:absolute;left:31%;width:50%;bottom:3.5%;padding:3% 2%;text-align:center;font-size:calc(var(--P)*.062);line-height:1.15;color:#d6336c;background:#fff6dc;border:2px dashed #d6336c;border-radius:6px;box-shadow:0 4px 10px rgba(60,35,10,.35);opacity:0;transform:translateY(10px) rotate(-2deg) scale(.9);transition:opacity .6s,transform .6s;pointer-events:none;z-index:7}
#wish.on{opacity:1;transform:rotate(-2deg) scale(1)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#bar{position:fixed;left:0;right:0;bottom:0;min-height:78px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .5s}
#bar.on{opacity:1;pointer-events:auto}
.btn{font:inherit;font-size:15px;color:var(--ink);background:#f4e6c8;border:2px dashed #8a6238;border-radius:6px;padding:9px 13px;box-shadow:0 2px 0 rgba(60,35,10,.35);cursor:pointer;touch-action:manipulation}
.btn:active,.btn.hot{background:#f6e96b;transform:translateY(1px)}
#mic{display:flex;align-items:center;gap:6px;background:#f4e6c8;border:2px dashed #8a6238;border-radius:6px;padding:8px 10px;font-size:14px}
#meter{width:70px;height:10px;background:#e1cfa8;border-radius:5px;overflow:hidden;border:1px solid #8a6238}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9a6bb0,#e8508a)}
#note{flex-basis:100%;text-align:center;font-size:13px;min-height:16px;color:#3b2713}
</style></head><body>

<canvas id="confetti"></canvas>
<div id="bar">
 <button class="btn" id="backBtn">← back to cover</button>
 <div id="mic"><span>🎤</span><div id="meter"><i></i></div></div>
 <button class="btn" id="holdBtn">hold to blow 💨</button>
 <button class="btn" id="relightBtn">relight 🕯</button>
 <div id="note"></div>
</div>
<script>
const NAME='Zara';
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const book=$('#book'),flip=$('#flip'),bar=$('#bar'),lw=$('#lw'),wish=$('#wish'),meter=$('#meter i'),note=$('#note'),holdBtn=$('#holdBtn');
const fls=[...document.querySelectorAll('.fl')];
let isOpen=false,out=false,held=false,intensity=0,blowT=0,last=0;
let ac=null,an=null,buf=null,stream=null,micOK=false,lvl=0,base=.01;
wish.textContent='make a wish, '+NAME+' ✨';

function layout(){
  const vw=innerWidth,vh=innerHeight,availH=vh-78-36;
  const P=Math.max(120,Math.min(vw*.47,availH*4/3));
  const Pc=Math.min(vw*.9,availH*.86*4/3);
  document.documentElement.style.setProperty('--P',P+'px');
  document.documentElement.style.setProperty('--k',Math.max(1,Pc/P));
}
addEventListener('resize',layout);layout();requestAnimationFrame(()=>requestAnimationFrame(()=>book.classList.add('ready')));

function say(t){note.textContent=t}
async function enableMic(){
  if(micOK)return;
  try{
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('insecure');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
    an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(stream).connect(an);
    buf=new Float32Array(an.fftSize);micOK=true;base=.01;
    say('Mic is on, blow into it! (or hold the button / spacebar)');
  }catch(e){
    micOK=false;
    say(window.isSecureContext?'Mic blocked, hold the button or spacebar to blow.':'Mic needs https, host this file to use it. Hold the button or spacebar for now.');
  }
}
function stopMic(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(ac)ac.close();stream=ac=an=null;micOK=false;
}

function openCard(){
  if(isOpen)return;isOpen=true;
  book.classList.remove('closed');flip.classList.add('open');bar.classList.add('on');
  say(innerHeight>innerWidth?'Tip: turn your phone sideways for a bigger card 📱':'');enableMic().then(()=>{if(innerHeight>innerWidth&&micOK)say('Tip: turn your phone sideways for a bigger card 📱')});
}
function closeCard(){
  if(!isOpen)return;isOpen=false;
  lw.classList.remove('up');
  flip.classList.remove('open');book.classList.add('closed');bar.classList.remove('on');
  stopMic();held=false;holdBtn.classList.remove('hot');
}
$('#cover').addEventListener('click',openCard);
$('#backBtn').addEventListener('click',closeCard);
lw.addEventListener('click',()=>lw.classList.toggle('up'));
$('#mic').addEventListener('click',()=>{if(!micOK)enableMic()});

holdBtn.addEventListener('pointerdown',e=>{e.preventDefault();held=true;holdBtn.classList.add('hot')});
['pointerup','pointerleave','pointercancel'].forEach(ev=>holdBtn.addEventListener(ev,()=>{held=false;holdBtn.classList.remove('hot')}));
addEventListener('keydown',e=>{if(e.code==='Space'&&isOpen){e.preventDefault();if(!e.repeat){held=true;holdBtn.classList.add('hot')}}});
addEventListener('keyup',e=>{if(e.code==='Space'){held=false;holdBtn.classList.remove('hot')}});

function snuff(){
  out=true;
  fls.forEach((f,i)=>setTimeout(()=>{
    f.classList.add('out');f.style.transform='rotate(80deg) scale(.1)';
    const s=document.createElement('div');s.className='smoke';
    s.style.left=(parseFloat(f.style.left)+parseFloat(f.style.width)/2-3)+'%';
    s.style.top=(parseFloat(f.style.top)+parseFloat(f.style.height)-6)+'%';
    $('#flames').appendChild(s);setTimeout(()=>s.remove(),1600);
  },i*90));
  setTimeout(()=>{wish.classList.add('on');burst()},450);
}
function relight(){
  out=false;blowT=0;intensity=0;wish.classList.remove('on');parts.length=0;
  fls.forEach(f=>{f.classList.remove('out');f.style.transform=''});
}
$('#relightBtn').addEventListener('click',relight);

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  drawConfetti(dt);
  if(!isOpen)return;
  let target=0;
  if(micOK&&an){
    an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
    const rms=Math.sqrt(s/buf.length);lvl+=(rms-lvl)*.4;
    if(lvl<base*1.6+.01)base+=(lvl-base)*.02;
    target=clamp((lvl-(base+.025))/.1,0,1);
    meter.style.width=clamp(lvl/.3,0,1)*100+'%';
  }
  if(held)target=1;
  intensity+=(target-intensity)*.3;
  if(!micOK)meter.style.width=intensity*100+'%';
  if(out)return;
  fls.forEach((f,i)=>{
    const b=clamp(intensity*(1+.15*Math.sin(t/55+i*1.7)),0,1.2);
    f.style.transform='rotate('+(b*58)+'deg) scale('+(1-.2*b)+','+(1-.3*b)+')';
  });
  if(intensity>.3)blowT+=dt;else blowT=Math.max(0,blowT-dt*.6);
  if(blowT>=.5)snuff();
}

const cv=$('#confetti'),cx=cv.getContext('2d'),parts=[];
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',fit);fit();
function burst(){
  const r=$('#rp').getBoundingClientRect(),cols=['#f6e96b','#9a6bb0','#e8508a','#1d4fb3','#ffffff','#f2a65a'];
  for(let i=0;i<150;i++){
    const a=-Math.PI/2+(Math.random()-.5)*2.2,v=300+Math.random()*600;
    parts.push({x:r.left+r.width*.55,y:r.top+r.height*.45,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*14,c:cols[i%cols.length],life:3.5+Math.random()*1.5});
  }
}
function drawConfetti(dt){
  cx.clearRect(0,0,cv.width,cv.height);
  const d=devicePixelRatio;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.vy+=700*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt;
    if(p.life<=0||p.y>innerHeight+30){parts.splice(i,1);continue}
    cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=clamp(p.life,0,1);
    cx.fillRect(-p.w/2*d,-p.h/2*d,p.w*d,p.h*d);cx.restore();
  }
}
requestAnimationFrame(frame);
